<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162444"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
  </defs>
  <!-- Shield Background -->
  <path d="M50 5 L88 20 C88 60, 50 92, 50 95 C50 92, 12 60, 12 20 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Crown -->
  <polygon points="30,48 38,32 50,42 62,32 70,48" fill="url(#goldGrad)" />
  <!-- Monogram Letters PH -->
  <text x="50" y="68" font-family="'Cinzel', serif, Georgia" font-size="18" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">PH</text>
  <!-- Small Star at Bottom of Shield -->
  <polygon points="50,73 52,77 56,77 53,80 54,84 50,81 46,84 47,80 44,77 48,77" fill="#ffd700"/>
</svg>

